<html lang="id">
<head>

<title>StreetBound — Night City</title>

 background:linear-gradient(93deg,#ffffff 5%,#ffd9a8 34%,#f97316 60%,#f43f5e 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 0 24px rgba(249,115,22,.45)) drop-shadow(0 6px 14px rgba(0,0,0,.8))}
h1 em{display:block;font-style:italic}
#tag{margin:2px 0 0;font-size:14px;font-weight:600;letter-spacing:2px;color:#cbd5e1;text-shadow:0 2px 8px #000}
#tag b{color:#fbbf24}
#btns{display:flex;flex-direction:column;gap:14px;margin-top:36px;width:min(320px,82vw);pointer-events:auto}
#btns button{font-family:inherit;cursor:pointer;border-radius:14px;font-weight:800;letter-spacing:4px;display:flex;align-items:center;justify-content:center;gap:12px;transition:.18s}
#play{padding:18px 24px;font-size:22px;border:none;color:#1c0a02;background:linear-gradient(95deg,#fbbf24,#f97316 55%,#f43f5e);
 box-shadow:0 6px 30px rgba(249,115,22,.55),inset 0 2px 0 rgba(255,255,255,.35);animation:pulse 2.2s infinite}
#play:hover{transform:translateY(-3px) scale(1.02)}
#play:active{transform:scale(.97)}
#play:disabled{filter:grayscale(.5);cursor:wait;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 6px 30px rgba(249,115,22,.5),inset 0 2px 0 rgba(255,255,255,.35)}50%{box-shadow:0 8px 46px rgba(249,115,22,.85),inset 0 2px 0 rgba(255,255,255,.35)}}
#set{padding:13px 22px;font-size:15px;background:rgba(11,18,32,.75);border:2px solid #334155;color:#cbd5e1}
#set:hover{border-color:#64748b;color:#fff}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#set.shk{animation:shk .3s}
#saldo{margin-top:8px;font-size:13px;font-weight:800;letter-spacing:1px;color:#86efac;text-shadow:0 1px 6px #000}
#foot{position:fixed;left:0;right:0;bottom:14px;z-index:2;text-align:center;font-size:12px;letter-spacing:1.5px;color:#94a3b8;text-shadow:0 1px 4px #000}
#toast{position:fixed;top:26px;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(11,18,32,.92);border:1px solid #334155;padding:10px 22px;border-radius:10px;font-weight:800;letter-spacing:3px;font-size:14px;opacity:0;transition:.25s;z-index:3;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#boot{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#04060f;font-weight:800;letter-spacing:5px;color:#67e8f9;font-size:15px}
</style>
</head>

{const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');

 const rr=62+Math.random()*88,x=Math.cos(ang)*rr,z=Math.sin(ang)*rr;
